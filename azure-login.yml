name: azure-oidc-test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # obrigatório para o OIDC
  contents: read

jobs:
  login-test:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verificar acesso
        run: az group show --name rg-portfolio-dev --output table
