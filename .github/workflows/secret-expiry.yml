name: secret-expiry

on:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  secret-expiry:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check secret expiry
        run: |
          set -euo pipefail
          secrets=$(az keyvault secret list --vault-name '${{ vars.KEY_VAULT_NAME }}' --include-managed true --query '[].{name: name, expires: attributes.expires}' -o json)
          test "$(jq length <<< "$secrets")" -gt 0
          jq -r --argjson limit "$(date -u -d '+30 days' +%s)" '
            .[]
            | select(.expires == null or (.expires | sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601) < $limit)
            | "::error::\(.name) expires \(.expires // "never: set an expiry")"
          ' <<< "$secrets" | tee "$RUNNER_TEMP/expiring"
          test ! -s "$RUNNER_TEMP/expiring"
