name: agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - ".github/workflows/agent.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply after plan"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-agent
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_mcp_docs_client_id: ${{ vars.MCP_DOCS_CLIENT_ID }}
  TF_IN_AUTOMATION: "true"
  WORKING_DIR: agent

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v6

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=agent.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform plan
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.apply)
        run: |
          terraform apply \
            -input=false \
            -lock-timeout=5m \
            -auto-approve \
            tfplan

      - name: Remove the host storage connection string the provider writes
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.apply)
        run: |
          set -euo pipefail
          apps=$(az functionapp list --resource-group rg-portfolio-dev --query '[].name' --output tsv)
          test -n "$apps"
          for app in $apps; do
            az functionapp config appsettings delete --resource-group rg-portfolio-dev --name "$app" --setting-names AzureWebJobsStorage --output none
          done
